name: Build & Push Frontend to GHCR

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ems-ng

jobs:
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Setup Docker Buildx (for multi-platform & cache support) ─────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Log in to GitHub Container Registry ─────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # ── Extract metadata (tags & labels) ─────────────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # ── Build and push ────────────────────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. DEPLOY — Sadece ems-ng servisini sunucuda güncelle
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy Frontend to Production
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: emsadmin
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USERNAME
          script: |
            set -e

            # 1. GHCR'a giriş (Sunucunun yeni imajı çekebilmesi için)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            # 2. Compose dosyasının olduğu dizine git
            cd /opt/ems

            # 3. SADECE frontend imajını çek (Backend servislerini ellememek için)
            docker-compose -f docker-compose-prod.yml --env-file .env pull ems-ng

            # 4. SADECE frontend servisini yeniden başlat (--no-deps ile bağımlılıkları tetiklemez)
            docker-compose -f docker-compose-prod.yml --env-file .env up -d --no-deps ems-ng

            # 5. Sunucuda biriken eski imajları temizle
            docker image prune -f
